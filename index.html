<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0f5">
  <title>Para mi florcita 🌷</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: #62364b;
      background: linear-gradient(180deg, #fff4f7, #fce8ef);
      overflow-x: hidden;
    }

    section {
      width: min(900px, 92%);
      margin: 28px auto;
      padding: 38px 24px;
      text-align: center;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid #f5dce6;
      border-radius: 24px;
      box-shadow: 0 8px 28px rgba(130, 53, 82, 0.08);
    }

    .hero {
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #ffe1eb, #fff7fa);
    }

    .flower {
      font-size: 60px;
      margin-bottom: 10px;
    }

    .kicker {
      letter-spacing: 3px;
      text-transform: uppercase;
      font-size: 12px;
      color: #b65e82;
    }

    h1 {
      font-size: clamp(38px, 8vw, 68px);
      margin: 18px 0;
      color: #a74770;
    }

    h2 {
      font-size: clamp(25px, 5vw, 36px);
      color: #a74770;
      margin-top: 0;
    }

    p {
      font-size: 17px;
      line-height: 1.9;
    }

    .center {
      max-width: 650px;
      margin: 0 auto;
    }

    .btn {
      display: inline-block;
      margin: 10px 5px;
      padding: 13px 23px;
      border: 0;
      border-radius: 30px;
      background: #b74f79;
      color: white;
      text-decoration: none;
      font: inherit;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: #96385f;
    }

    .secondary {
      background: #fff0f5;
      color: #a74770;
      border: 1px solid #efcada;
    }

    .letter {
      white-space: normal;
      text-align: left;
    }

    .counter {
      font-size: clamp(44px, 12vw, 76px);
      font-weight: bold;
      color: #bd527e;
      margin: 20px 0;
    }

    .small {
      font-size: 13px;
      color: #946b7d;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
      margin-top: 25px;
    }

    .photo {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 15px;
      cursor: zoom-in;
      background: #f8e4ec;
      border: 1px solid #f0d6e1;
      transition: transform 0.2s;
    }

    .photo:hover {
      transform: scale(1.02);
    }

    .caption {
      font-size: 14px;
      margin: 8px 0 15px;
    }

    .memory {
      min-width: 0;
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(35, 15, 26, 0.94);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 95%;
      max-height: 85vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 12px;
    }

    .close {
      position: absolute;
      top: 12px;
      right: 18px;
      border: 0;
      background: transparent;
      color: white;
      font-size: 42px;
      cursor: pointer;
    }

    footer {
      padding: 25px 12px 35px;
      text-align: center;
      color: #946b7d;
      font-size: 14px;
    }

    .heart {
      position: fixed;
      bottom: -40px;
      z-index: 10000;
      pointer-events: none;
      animation: floatHeart 4s ease-in forwards;
    }

    @keyframes floatHeart {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(-110vh) rotate(25deg);
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      section {
        padding: 30px 17px;
        margin: 18px auto;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .photo {
        height: 240px;
      }

      p {
        font-size: 16px;
      }
    }

    /* Animaciones románticas suaves */
    .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .memory {
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .memory:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(183, 79, 121, 0.15);
      border-radius: 15px;
    }

    .counter {
      animation: counterPulse 3s ease-in-out infinite;
    }

    @keyframes counterPulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.035);
      }
    }

    .final-heart {
      margin-top: 12px;
      font-size: 32px;
      animation: heartBeat 1.8s ease-in-out infinite;
    }

    @keyframes heartBeat {
      0%, 100% {
        transform: scale(1);
      }
      15% {
        transform: scale(1.16);
      }
      30% {
        transform: scale(1);
      }
      45% {
        transform: scale(1.1);
      }
    }

    .petal {
      position: fixed;
      top: -35px;
      z-index: 9998;
      pointer-events: none;
      animation: petalFall linear forwards;
      filter: drop-shadow(0 2px 3px rgba(130, 53, 82, 0.12));
    }

    @keyframes petalFall {
      to {
        transform: translate3d(var(--drift, 30px), 110vh, 0) rotate(360deg);
        opacity: 0.15;
      }
    }

    .sparkle {
      position: fixed;
      z-index: 10002;
      pointer-events: none;
      animation: sparkleOut 0.8s ease-out forwards;
    }

    @keyframes sparkleOut {
      from {
        transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
        opacity: 0;
      }
      30% {
        opacity: 1;
      }
      to {
        transform: translate(-50%, -80%) scale(1.5) rotate(70deg);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .reveal {
        opacity: 1;
        transform: none;
      }
    }

    /* Fondo decorativo de flores, manteniendo el fondo rosado */
    body::before,
    body::after {
      position: fixed;
      z-index: 0;
      pointer-events: none;
      font-size: clamp(35px, 7vw, 90px);
      line-height: 1.8;
      white-space: pre-wrap;
      opacity: 0.33;
      filter: drop-shadow(0 3px 7px rgba(180, 80, 130, 0.12));
    }

    body::before {
      content: "🌸\\A\\A 🌺\\
