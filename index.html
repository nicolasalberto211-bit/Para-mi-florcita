<html lang="es">

      color: #62364b;
      background: linear-gradient(180deg, #fff4f7, #fce8ef);

      min-height: 85vh;

      text-transform: uppercase;
      font-size: 12px;
      color: #b65e82;
    }

      color: #a74770;
    }

      margin-top: 0;
    }

    p {
      font-size: 17px;
      line-height: 1.9;
    }

    .center {
      max-width: 650px;
      margin: 0 auto;
    }
